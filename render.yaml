services:
  - type: web
    name: fleeting-logistics
    env: python
    plan: starter
    runtime: python-3.11.9
    buildCommand: >
      python -m pip install --upgrade pip &&
      pip install -r requirements.txt &&
      python manage.py migrate --noinput &&
      python manage.py collectstatic --noinput
    # Use bash so ${PORT:-10000} expands; blank PORT breaks --bind otherwise.
    startCommand: bash -lc 'exec gunicorn fleeting_logistics.wsgi:application --bind 0.0.0.0:${PORT:-10000}'
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DISABLE_COLLECTSTATIC
        value: "false"
